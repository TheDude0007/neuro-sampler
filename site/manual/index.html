<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuro SS Field Manual</title>
<meta name="description" content="The interactive 3D manual for Neuro Sampler Suite: 14 lessons, every control shown on a live model of the plugin. Developed independently by Collin Garchar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an app shell. Lessons rail | live 3D model of the plugin | step card. The model is the page; text explains what it shows. Single dark look by choice. */
:root {
  --void: #06050c; --deck: #100d1b; --deck-2: #181329; --line: #2a2344;
  --ink: #efeaff; --dim: #9e95c2; --plasma: #ff3df2; --uv: #39f3ff; --gold: #ffd23d; --lime: #9dff6a;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--uv); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* top bar */
.top { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: rgba(6,5,12,.9); position: relative; z-index: 5; }
.logo { font-family: var(--f-display); font-weight: 900; font-size: 14px; letter-spacing: .05em; white-space: nowrap; }
.logo b { color: var(--plasma); }
.logo span { color: var(--dim); font-weight: 500; margin-left: 6px; }
.prog { flex: 1; min-width: 0; height: 4px; border-radius: 2px; background: var(--deck-2); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--plasma), var(--uv)); transition: width .4s; }
.pill { border: 1px solid var(--line); background: var(--deck); border-radius: 999px; padding: 4px 12px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); }
.pill[aria-pressed="true"] { border-color: var(--lime); color: var(--lime); }
.credit { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.credit b { color: var(--gold); font-weight: 600; }
@media (max-width: 1100px) { .top .credit { display: none; } }

/* body grid */
.main { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; }
.rail { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px 20px; background: linear-gradient(180deg, var(--deck), var(--void)); }
.rail h2 { font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin: 6px 10px 10px; font-weight: 400; }
.lesson { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; color: var(--dim); }
.lesson:hover { color: var(--ink); background: var(--deck-2); }
.lesson[aria-current="true"] { color: var(--ink); border-color: var(--line); background: linear-gradient(90deg, rgba(255,61,242,.16), transparent); }
.lesson .n { font-family: var(--f-mono); font-size: 11px; color: var(--uv); }
.lesson .t { font-weight: 500; font-size: 14px; line-height: 1.25; }
.lesson .ok { font-size: 12px; color: var(--lime); opacity: 0; }
.lesson.done .ok { opacity: 1; }
.rail .foot { margin: 18px 10px 0; font-size: 12px; color: var(--dim); display: grid; gap: 6px; }
.rail .foot b { color: var(--gold); font-weight: 600; }
.rail .foot a { color: var(--uv); }

.work { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
.stage { position: relative; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #241040, var(--void) 72%); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.callout { position: absolute; left: 0; top: 0; transform: translate(-50%, calc(-100% - 14px)); pointer-events: none; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; padding: 6px 11px; border-radius: 6px; background: rgba(6,5,12,.88); border: 1px solid var(--plasma); color: var(--ink); white-space: nowrap; box-shadow: 0 0 22px rgba(255,61,242,.45); transition: opacity .25s; }
.callout::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 14px; background: linear-gradient(var(--plasma), transparent); }
.callout b { color: var(--plasma); }
.stage .hud { position: absolute; left: 14px; bottom: 12px; font-family: var(--f-mono); font-size: 11px; color: var(--dim); pointer-events: none; }
.stage .views { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }

.card { border-top: 1px solid var(--line); background: linear-gradient(180deg, var(--deck-2), var(--deck)); padding-block: 18px 16px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 24px; align-items: end; }
.card .eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--uv); }
.card h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 2.2vw, 28px); margin: 4px 0 6px; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; color: #d6cff0; max-width: 72ch; }
.card p b, .card p strong { color: var(--ink); }
.card kbd, .card code { font-family: var(--f-mono); font-size: 12.5px; background: var(--void); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--gold); }
.tip { margin-top: 8px !important; font-size: 13.5px; color: var(--dim) !important; }
.tip::before { content: "TIP  "; font-family: var(--f-mono); color: var(--lime); font-size: 11px; letter-spacing: .14em; }
.cmd { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; max-width: 760px; }
.cmd pre { flex: 1; min-width: 0; margin: 0; overflow-x: auto; font-family: var(--f-mono); font-size: 12px; background: var(--void); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; color: var(--uv); }
.nav { display: grid; gap: 10px; justify-items: end; }
.dots { display: flex; gap: 5px; }
.dot { width: 22px; height: 6px; border-radius: 3px; background: var(--line); border: 0; padding: 0; cursor: pointer; }
.dot.on { background: linear-gradient(90deg, var(--plasma), var(--uv)); }
.dot.seen { background: #4d4078; }
.btns { display: flex; gap: 8px; }
.btn { padding: 10px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--deck); font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.btn.hot { border: 0; background: linear-gradient(100deg, var(--plasma), #8a4dff 55%, var(--uv)); color: #0a0612; font-weight: 600; box-shadow: 0 0 22px rgba(255,61,242,.4); }
.btn[aria-pressed="true"] { border-color: var(--lime); color: var(--lime); }
.btn:disabled { opacity: .35; cursor: default; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)); }
  .rail h2, .rail .foot { display: none; }
  .lesson { grid-template-columns: auto auto; width: auto; flex: none; padding: 6px 10px; }
  .lesson .ok { display: none; }
  .stage { height: 380px; }
  .card { grid-template-columns: 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav { justify-items: start; }
  .top .prog { display: none; }
  .mobile-credit { display: block !important; }
  .logo span, .top a.pill { display: none; }
  html, body { overflow-x: hidden; }
}
.mobile-credit { display: none; padding: 14px 16px 24px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.mobile-credit b { color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .prog i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">NEURO <b>SS</b><span>FIELD MANUAL</span></div>
    <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
    <span class="credit">Developed Independently By <b>Collin Garchar</b></span>
    <button class="pill" id="snd" aria-pressed="false">♪ Sound off</button>
    <a class="pill" href="/">Tour</a>
  </header>
  <div class="main">
    <nav class="rail" aria-label="Lessons">
      <h2>15 lessons · about 25 min</h2>
      <div id="lessons" style="display:contents"></div>
      <div class="foot">
        <span>Use <b>←</b> <b>→</b> to step. Click the 3D pads to play them.</span>
        <span>Developed Independently By <b>Collin Garchar</b></span>
        <a href="https://github.com/TheDude0007/neuro-sampler/releases/latest">Download v1.13</a>
      </div>
    </nav>
    <section class="work">
      <div class="stage" id="stage">
        <canvas id="gl" aria-label="A 3D model of the Neuro Sampler Suite plugin. The control for the current step is highlighted."></canvas>
        <div class="callout" id="callout"></div>
        <div class="views"><button class="pill" id="viewAll" title="Show the whole plugin">Whole view</button></div>
        <div class="hud" id="hud"></div>
      </div>
      <div class="card" aria-live="polite">
        <div>
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="stepTitle"></h1>
          <p id="stepText"></p>
          <div id="stepExtra"></div>
        </div>
        <div class="nav">
          <div class="dots" id="dots"></div>
          <div class="btns">
            <button class="btn" id="back">← Back</button>
            <button class="btn" id="auto" aria-pressed="false">Autoplay</button>
            <button class="btn hot" id="next">Next →</button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div class="mobile-credit">Developed Independently By <b>Collin Garchar</b></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const C = { bg: '#07050f', grid: '#1c1630', line: '#2a2344', ink: '#efeaff', dim: '#8f86b5', plasma: '#ff3df2', uv: '#39f3ff', gold: '#ffd23d', lime: '#9dff6a', violet: '#8a4dff' };

/* ================= panels (tab pages) ================= */

  SLICE: ['b:Auto-Slice', 'k:Sensitivity', 'b:Grid', 'b:Clear', 'm:Mode: One-Shot', 'k:Attack', 'k:Release', 'b:x0.5', 'b:x2', 'b:1:1', 'b:Apply to all', 't:Preserve transients', 'm:Pads / Keys', 'b:Oct-', 'b:Oct+'],

};
const TABS = ['SLICE', 'PAD', 'ARP', 'GEN', 'SEQ', 'EVOLVE', 'KIT', 'CHOP', 'CHORD'];
const TOP = ['Load', 'Library', 'Key...', 'MIDI', 'MIDI Learn', 'Save'];

/* ================= lessons =================
   target: 'all' | 'screen' | 'pads' | 'pad:N' | 'repeat' | 'lock' | 'jog' | 'lcd' | 'tab:NAME' | 'top:LABEL' | 'pi:LABEL' (panel item) | 'body' */
const KITNAMES = ['Kick', 'Snare', 'C.Hat', 'O.Hat', 'Clap', '808', 'Perc', 'Rim', 'Kick', 'Snare', 'C.Hat', 'Cymbal', 'Perc', 'Tom', 'FX', 'Vox'];
const CHORDNAMES = ['C', 'Dm', 'Em', 'F', 'G', 'Am', 'Bdim', "C'", 'Cmaj7', 'Dm7', 'Em7', 'Fmaj7', 'G7', 'Am7', 'Bm7♭5', "Cmaj7'"];
const L = [
 { id: 'start', name: 'Install', tab: 'SLICE', steps: [
  { t: 'Download the build', d: 'Get <b>Neuro-Sampler-Suite-1.13.0-macOS-arm64.zip</b> from the GitHub Releases page and unzip it. It runs on Apple Silicon Macs (M1 or newer).', tg: 'all', scr: 'install', a: 2, lcd: 'v1.13.0 · ARM64' },
  { t: 'Copy the plugins', d: 'Copy <code>Neuro Sampler Suite.vst3</code> to <code>~/Library/Audio/Plug-Ins/VST3/</code> and <code>Neuro Sampler Suite.component</code> to <code>~/Library/Audio/Plug-Ins/Components/</code>. The Standalone app can go anywhere.', tip: 'In Finder, press Shift-Cmd-G and paste the folder path.', tg: 'all', scr: 'install', a: 4, lcd: 'VST3 · AU · APP' },
  { t: 'Unblock it once', d: 'The build isn\'t notarized yet, so macOS blocks it on first use. Paste this into Terminal once.', cmd: 'xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"Neuro Sampler Suite.vst3" ~/Library/Audio/Plug-Ins/Components/"Neuro Sampler Suite.component"', tg: 'all', scr: 'install', a: 5, lcd: 'QUARANTINE OFF' },
  { t: 'Open it in your DAW', d: 'Restart your DAW. In <b>Logic</b>, add it as an instrument: AU Instruments ▸ Neuro Sampler Suite. In <b>Ableton Live</b>, rescan your VST3 plugins. Or open the <b>Standalone</b> app.', tip: 'Upgrading from NEURO MPC 1.3 or earlier? Delete the old NEURO MPC files first. Your projects still open.', tg: 'all', scr: 'install', a: 6, lcd: 'READY' }
 ]},
 { id: 'tour', name: 'Tour of the machine', tab: 'SLICE', steps: [
  { t: 'The top bar', d: '<b>Load</b> a sample, open the <b>Library</b>, set the song key with <b>Key...</b>, pick a controller template in <b>MIDI</b>, map any control with <b>MIDI Learn</b>, and <b>Save</b> presets.', tg: 'topbar', scr: 'wave', lcd: 'NO SAMPLE' },
  { t: 'The waveform', d: 'Drop any WAV, AIFF, FLAC, OGG or MP3 here. Zoom with the mouse wheel or a pinch, and drag to pan. <b>Double-click</b> splits a slice, <b>drag</b> moves a marker, and <b>right-click</b> removes one.', tg: 'screen', scr: 'wave', lcd: 'BREAK 92 BPM' },
  { t: 'Nine tabs', d: 'Each tab opens its page of controls under the waveform: <b>SLICE · PAD · ARP · GEN · SEQ · EVOLVE · KIT · CHOP · CHORD</b>.', tg: 'tabs', scr: 'wave', lcd: 'TAB: SLICE' },
  { t: 'The tab page', d: 'The controls of the open tab. In the <b>SLICE</b> tab you slice by transients or grid, and set the One-Shot or Gate mode, attack, release and time-stretch (×0.5 · ×2 · 1:1).', tg: 'panel', scr: 'wave', lcd: 'SLICE', hi: ['Auto-Slice', 'Grid', 'x0.5', 'x2'] },
  { t: '16 pads, 8 banks', d: 'There are 128 pads in <b>banks A–H</b>. Pad 1 is bottom left, as on an MPC, and plays on MIDI note <b>36 (C1)</b>. Click the 3D pads to play them.', tg: 'pads', scr: 'wave', pads: 'play', lcd: 'BANK A · C1–D#2' },
  { t: 'REPEAT and the jog knobs', d: '<b>REPEAT</b> under the pads is Note Repeat. The two knobs at the top right are <b>START</b> and <b>END</b> for jog chopping. The display between them shows what you just played.', tg: 'rightcol', scr: 'wave', lcd: 'K5 START · K6 END' }
 ]},
 { id: 'library', name: 'Library & kits', tab: 'SLICE', steps: [

  { t: 'Add your folders', d: 'A library has <b>sections</b>, such as Drums, Melodies and Vocals. <b>+ Folder</b> adds a folder, with every subfolder, to the current section. Nothing is copied: your packs stay where they are. About 51,000 files index in 2.7 s.', tg: 'screen', scr: 'sections', lcd: 'INDEXING' },
  { t: 'Search and filter', d: 'Every word you type must appear in the file\'s path, so <code>808 zay</code> or <code>140 bpm</code> narrows it down fast. Filter by <b>type</b> (18 types, one-shots or loops) and by <b>pack</b>. BPM and key are read from the file names.', tg: 'screen', scr: 'library', a: 1, lcd: '18 TYPES' },
  { t: 'Preview, then load', d: '<b>Click</b> a row to preview it through the plugin, at mix level. The <b>arrow keys</b> browse while it plays. <b>Double-click</b> or <b>Load</b> loads it to slice and chop.', tg: 'screen', scr: 'library', a: 2, lcd: '▶ PREVIEW' },
  { t: 'Auto kit', d: '<b>Auto kit</b> fills 16 kit pads in MPC order: A1 Kick, A2 Snare, A3 Closed Hat, A4 Open Hat, A5 Clap, A6 808 and so on. Tick <b>Same pack</b> to keep every sound from the kick\'s pack. No sound is used twice.', tg: 'screen', scr: 'autokit', pads: 'kit', lcd: 'AUTO KIT' },
  { t: 'Kit → pads', d: '<b>Kit -> pads</b> writes one 48 kHz WAV to <code>~/Music/NEURO MPC/Kits/</code> and loads it with one slice per sound, so slice <i>n</i> is on pad <i>n</i>. Projects keep working even if your packs move.', tg: 'pads', scr: 'autokit', a: 1, pads: 'kit', lcd: 'KIT LOADED' }
 ]},
 { id: 'chop', name: 'Chop a loop', tab: 'CHOP', steps: [

  { t: 'Chop it', d: 'Click <b>Chop</b>. Slices are tinted by drum, and pads <b>A1, A2 and A3</b> now play the kick, snare and closed hat.', tg: 'pi:Chop', scr: 'chop', pads: 'kit', hi: ['Chop'], lcd: 'A1 KICK' },
  { t: 'Fix it by hand', d: '<b>Double-click</b> adds a marker, <b>drag</b> moves it, and <b>Delete</b> removes the one under the mouse. Turn on <b>Snap to hits</b> and markers snap to the nearest hit within 12 px.', tg: 'screen', scr: 'edit', hi: ['Snap to hits'], lcd: 'SNAP ON' },

 ]},
 { id: 'jog', name: 'Jog chop', tab: 'CHOP', steps: [

/* ================= audio ================= */
let ac = null, master = null, soundOn = false, noiseBuf = null;
const sndBtn = $('#snd');
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .5; const k = ac.createDynamicsCompressor(); master.connect(k); k.connect(ac.destination); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function setSound(on) { soundOn = on; sndBtn.setAttribute('aria-pressed', on); sndBtn.textContent = on ? '♪ Sound on' : '♪ Sound off'; if (on) audio(); }
sndBtn.addEventListener('click', () => setSound(!soundOn));
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(m, when = 0, dur = .7, vel = .7) {
  if (!soundOn || !audio()) return;
  const t = ac.currentTime + when + .005, o1 = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o1.type = 'sawtooth'; o2.type = 'square'; o1.frequency.value = mtof(m); o2.frequency.value = mtof(m) * 1.005;
  f.type = 'lowpass'; f.Q.value = 5; f.frequency.setValueAtTime(700 + vel * 3000, t); f.frequency.exponentialRampToValueAtTime(380, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08 * vel, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(master); o1.start(t); o2.start(t); o1.stop(t + dur + .05); o2.stop(t + dur + .05);
}
function drum(kind, vel = 1) {
  if (!soundOn || !audio()) return;
  const t = ac.currentTime + .005, g = ac.createGain(); g.connect(master);
  if (kind === 'Kick' || kind === '808') {
    const o = ac.createOscillator(); o.frequency.setValueAtTime(kind === '808' ? 90 : 150, t); o.frequency.exponentialRampToValueAtTime(kind === '808' ? 45 : 42, t + .15);
    g.gain.setValueAtTime(.9 * vel, t); g.gain.exponentialRampToValueAtTime(.001, t + (kind === '808' ? .9 : .38)); o.connect(g); o.start(t); o.stop(t + 1);
    return;
  }
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const n = ac.createBufferSource(), f = ac.createBiquadFilter(); n.buffer = noiseBuf;
  const hat = /Hat|Cymbal/.test(kind), len = kind === 'O.Hat' || kind === 'Cymbal' ? .35 : hat ? .05 : .2;
  f.type = hat ? 'highpass' : 'bandpass'; f.frequency.value = hat ? 7000 : kind === 'Clap' ? 1300 : kind === 'Rim' ? 2600 : 1800;
  g.gain.setValueAtTime((hat ? .32 : .6) * vel, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
  n.connect(f); f.connect(g); n.start(t); n.stop(t + len + .02);
}
const CHORD_MIDI = (() => { const sc = [0, 2, 4, 5, 7, 9, 11], note = i => 60 + 12 * Math.floor(i / 7) + sc[i % 7]; const out = []; for (let p = 0; p < 16; p++) { const d = p % 8, rich = p >= 8; out.push((rich ? [0, 2, 4, 6] : [0, 2, 4]).map(o => note(d + o) - 12)); } return out; })();

/* ================= canvas helpers ================= */
function rr(x, ctx, X, Y, W, H, R) { ctx.beginPath(); ctx.moveTo(X + R, Y); ctx.arcTo(X + W, Y, X + W, Y + H, R); ctx.arcTo(X + W, Y + H, X, Y + H, R); ctx.arcTo(X, Y + H, X, Y, R); ctx.arcTo(X, Y, X + W, Y, R); ctx.closePath(); }
const box = (ctx, x, y, w, h, r) => rr(0, ctx, x, y, w, h, r);
function text(ctx, s, x, y, size, color, o = {}) { ctx.font = `${o.w || 500} ${size}px ${o.f || 'JetBrains Mono, monospace'}`; ctx.fillStyle = color; ctx.textAlign = o.a || 'left'; ctx.textBaseline = o.b || 'alphabetic'; ctx.fillText(s, x, y); }
function mul(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// a drum loop as peak envelope (1024 columns)
const HITS = [[0, 'Kick'], [.125, 'C.Hat'], [.25, 'Snare'], [.3125, 'Kick'], [.375, 'C.Hat'], [.5, 'Kick'], [.625, 'C.Hat'], [.75, 'Snare'], [.875, 'O.Hat']];
const HITCOL = { Kick: C.plasma, Snare: C.uv, 'C.Hat': C.gold, 'O.Hat': C.lime };
const WAVE = (() => { const r = mul(9), w = new Float32Array(1024); for (let i = 0; i < 1024; i++) { let v = .02 + r() * .02; HITS.forEach(([p, k]) => { const d = i / 1024 - p; if (d >= 0) v += Math.exp(-d * (k === 'Kick' ? 26 : k === 'Snare' ? 34 : k === 'O.Hat' ? 14 : 70)) * (k === 'Kick' ? 1 : k === 'Snare' ? .8 : .45) * (.75 + r() * .25); }); w[i] = Math.min(1, v); } return w; })();
function wave(ctx, x, y, w, h, o = {}) {
  const mid = y + h / 2;
  if (o.tint) HITS.forEach(([p, k], i) => { const p2 = i + 1 < HITS.length ? HITS[i + 1][0] : 1; ctx.fillStyle = HITCOL[k] + '22'; ctx.fillRect(x + p * w, y, (p2 - p) * w, h); });
  const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, C.uv); g.addColorStop(1, C.plasma);
  ctx.fillStyle = g; ctx.globalAlpha = o.alpha ?? 1;
  for (let i = 0; i < w; i += 2) { const v = WAVE[Math.floor(i / w * 1023)] * h * .46; ctx.fillRect(x + i, mid - v, 1.4, v * 2); }
  ctx.globalAlpha = 1;
  (o.marks || []).forEach((m, i) => { const mx = x + m * w; ctx.fillStyle = o.sel === i ? C.gold : 'rgba(239,234,255,.75)'; ctx.fillRect(mx - 1, y, 2, h); ctx.beginPath(); ctx.moveTo(mx - 6, y); ctx.lineTo(mx + 6, y); ctx.lineTo(mx, y + 8); ctx.fill(); });
  if (o.labels) HITS.forEach(([p, k]) => text(ctx, k.toUpperCase(), x + p * w + 6, y + 18, 13, HITCOL[k], { w: 600 }));
